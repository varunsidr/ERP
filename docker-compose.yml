# Local test target: app + disposable PostgreSQL on fixed ports. Not for real data.
# Start:  docker compose up --build -d
# Reset to baseline data (admin@mini-erp.test / Password123!):
#   curl -X POST http://localhost:4000/__test/reset -H "x-erp-test-token: local-test-support-token-123456" -H "content-type: application/json" -d '{"roleUsers":true}'
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: erp
      POSTGRES_PASSWORD: erp-local-password
      POSTGRES_DB: erp_local
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U erp -d erp_local"]
      interval: 5s
      timeout: 5s
      retries: 10
  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:4000:4000"
    environment:
      NODE_ENV: development
      PORT: "4000"
      DATABASE_URL: postgresql://erp:erp-local-password@db:5432/erp_local?schema=public
      DATABASE_URL_UNPOOLED: postgresql://erp:erp-local-password@db:5432/erp_local?schema=public
      JWT_SECRET: local-only-jwt-secret-at-least-32-characters
      PUBLIC_APP_URL: http://localhost:4000
      ERP_SEED_ADMIN_PASSWORD: Password123!
      AUTH_LOGIN_ATTEMPT_LIMIT: "1000"
      AUTH_SIGNUP_ATTEMPT_LIMIT: "1000"
      MAIL_MODE: outbox
      ERP_TEST_SUPPORT: enabled
      ERP_TEST_SUPPORT_TOKEN: local-test-support-token-123456
    command: ["sh", "-c", "npx prisma migrate deploy && node dist/server.js"]